plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.hasan.chortizero'
    compileSdk 34

    defaultConfig {
        applicationId "ir.hasan.chortizero"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}